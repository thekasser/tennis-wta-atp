name: Tennis Dashboard Refresh

on:
  schedule:
    # 3× per day at user-requested PST times. UTC offsets assume PDT
    # (UTC-7); during November-March (PST = UTC-8) the wall-clock times
    # shift +1h locally — accept the drift since GitHub cron is fixed-UTC.
    #
    # All three runs are FULL pipeline. Budget note: ~270 calls per
    # full run × 3/day = ~810/day during active weeks. With ~14 active
    # days/month × 810 + ~16 quiet days × ~50 = ~12k/month potential —
    # marginally over the 10k Matchstat cap on heavy active stretches.
    # Acceptable risk per user; we'll watch api_fetch_log totals and
    # tighten decide_fetch (per-player cooldown) if we trip the cap.
    - cron: '0 7 * * *'    # 12am PDT
    - cron: '0 17 * * *'   # 10am PDT
    - cron: '0 23 * * *'   # 4pm  PDT
  workflow_dispatch:       # allow manual trigger from Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Prevent two scheduled runs from racing on git push.
      group: refresh
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # ── Restore the SQLite DB from the committed snapshot ──────────────
      - name: Restore DB snapshot
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/restore_db.py

      # ── Re-seed bios + tournaments from the JS source files ───────────
      # The snapshot restored above has the player set from when it was
      # taken. If a manual bio addition (data/players_*.js) has landed
      # since the last snapshot, those bios won't be in the players table
      # without this step — so sync_matches won't fetch their data and
      # the dashboard never sees them. seed_db is idempotent: existing
      # rows are unchanged, new rows get inserted.
      - name: Seed bios + tournaments
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/seed_db.py

      # ── Sync rankings (~4 API calls) ───────────────────────────────────
      - name: Sync rankings
        env:
          MATCHSTAT_API_KEY: ${{ secrets.MATCHSTAT_API_KEY }}
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/sync_rankings.py --tour both

      # ── Sync matches (decide_fetch heuristic) ──────────────────────────
      # No --years flag → decide_fetch picks per-player: cold-starts get
      # full backfill (year-1, year), active-window players get current
      # year only, everyone else is skipped. Expected: ~80–200 calls/run
      # during active week, ~0 calls/run quiet weeks.
      - name: Sync matches
        env:
          MATCHSTAT_API_KEY: ${{ secrets.MATCHSTAT_API_KEY }}
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/sync_matches.py --tour both

      # ── Sync fixtures (upcoming match schedule) ────────────────────────
      # Pulls scheduled matches from getTournamentFixtures for each
      # tournament currently in its active window (date-derived). Cheap:
      # 1-2 calls per active tournament. The matchup predictor's "tomorrow"
      # panel and Live Events draw count both depend on this.
      - name: Sync fixtures
        env:
          MATCHSTAT_API_KEY: ${{ secrets.MATCHSTAT_API_KEY }}
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/sync_fixtures.py --tour both

      # ── Sync Kalshi market prices (free, no auth) ──────────────────────
      # Kalshi's free public API gives us a second market benchmark
      # alongside the sportsbook odds in matches.raw. Coverage is
      # near-100% on bio'd matches, including qualifying where
      # sportsbooks typically don't post. Zero impact on Matchstat budget.
      # --include-settled to capture post-match prices for backtest.
      - name: Sync Kalshi odds
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/sync_kalshi.py --include-settled

      # ── Log prospective predictions for upcoming/active matches ────────
      # MUST run BEFORE materialize so today's new predictions land in
      # data/predictions.js on the same cron run (instead of waiting for
      # the next one). Uses match_prob from backtest.py — same Python
      # port the PiT backtest trusts. After matches finish, JOIN
      # predictions on matches.winner_id for clean prospective Brier
      # (no PiT reconstruction). Zero API calls; pure DB compute.
      - name: Log predictions
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/log_predictions.py

      # ── Materialize all data/*.js files from the DB ────────────────────
      # Hash-based change detection means files only rewrite if data changed.
      - name: Materialize data files
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/materialize.py

      # ── Update the committed DB snapshot ───────────────────────────────
      - name: Snapshot DB
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/snapshot_db.py

      # ── Pre-commit sanity gate ─────────────────────────────────────────
      - name: Validate DB
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/validate.py

      # ── Push fresh blobs to D1 via the Worker's /api/admin/sync ────────
      # Phase 2: dashboard reads from D1, not from committed data/*.js files.
      # This is what actually makes the cron run "live" for users.
      - name: Push to Worker (D1)
        env:
          ADMIN_SYNC_TOKEN: ${{ secrets.ADMIN_SYNC_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -z "$ADMIN_SYNC_TOKEN" ]; then
            echo "::warning::ADMIN_SYNC_TOKEN secret not set — skipping D1 push"
          else
            python3 scripts/upload_to_worker.py
          fi

      # ── Commit & push the DB snapshot + manifest ───────────────────────
      # We only commit the things that drive future CI runs:
      #   - data/tennis.db.gz       (rehydrated by restore_db.py next run)
      #   - data/snapshot_summary.txt (PR-diffable manifest)
      #   - data/players_*.js, data/tournaments.js (curated inputs only
      #     change on manual edits — won't show up in `git status` here
      #     unless an editor touched them)
      # The derived data/*.js files (season_*, recent_matches, h2h, etc.)
      # are gitignored — D1 is the canonical store now.
      - name: Commit and push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No data changes — skipping commit" || \
            (git commit -m "chore: data refresh $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
